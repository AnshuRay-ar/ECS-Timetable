<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Find your class schedule by roll number and day.">
  <meta name="theme-color" content="#6750A4">
  <title>ECS Timetable By AK</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle dark mode">🌙 Dark Mode</button>

  <main class="container">
    <header class="page-header">
      <p class="eyebrow">KIIT • ECS</p>
      <h1>Check Your Class</h1>
      <p class="subtitle">Your weekly class schedule, organised by roll number.</p>
    </header>

    <form id="lookupForm">
      <div class="form-row">
        <div class="field">
          <label for="rollInput">Roll number</label>
          <input type="text" id="rollInput" name="roll" placeholder="Enter your roll number" autocomplete="off" required>
        </div>
        <div class="field">
          <label for="daySelect">Starting day</label>
          <select id="daySelect" name="day">
            <option value="MON">Monday</option>
            <option value="TUE">Tuesday</option>
            <option value="WED">Wednesday</option>
            <option value="THU">Thursday</option>
            <option value="FRI">Friday</option>
          </select>
        </div>
        <button type="submit" class="submit-button">Show Class</button>
      </div>
    </form>

    <section id="result" aria-live="polite" aria-atomic="true"></section>
    <p class="footer-note">Select your roll number and day to view your classes.</p>
  </main>
</body>
</html>
